[package]
name = "pcu-release-assets"
version = "0.1.3"
edition.workspace = true
authors.workspace = true
description = "Headless clients for a GitHub release's assets — download, upload, and publish — with no git checkout required"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
readme = "README.md"
repository.workspace = true
homepage = "https://github.com/jerus-org/pcu"
documentation = "https://docs.rs/pcu-release-assets"
keywords = ["ci", "github", "release"]
include = [
    "**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]
categories = ["development-tools::build-utils"]

[dependencies]
gql_client.workspace = true
log.workspace = true
octocrab.workspace = true
reqwest.workspace = true
serde.workspace = true
thiserror.workspace = true
# `time::sleep` for the release-lookup retry backoff, `fs` for reading an
# asset file to upload, `sync` for `OnceCell`'s runtime-deferred Octocrab
# construction (jerus-org/pcu#1085) — no runtime feature, since the crate
# never drives its own executor.
tokio = { version = "1.53.1", default-features = false, features = [
    "time",
    "fs",
    "sync",
] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock.workspace = true

[lints]
workspace = true

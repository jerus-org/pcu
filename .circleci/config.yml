version: 2.1

parameters:
  min_rust_version:
    type: string
    default: "1.89"
orbs:
  # cci-ignore-next-line
  toolkit: jerus-org/circleci-toolkit@7.1.0

# Custom executors removed - using toolkit rolling executors instead:
#   - toolkit/rust_env_rolling for Rust jobs
#   - toolkit/base_env for base jobs

jobs:
  # ── Retired cache-experiment jobs (exp-required-builds, exp-idiomatic-rust,
  # exp-msrv-build, exp-test-doc-build, exp-optional-builds) ──────────────────
  # These prototyped the fixes for digital-prstv/circleci-toolkit#437 (shared
  # build cache + compiler version) and #438 (optional_builds cache split +
  # non-blocking failures). Both shipped in toolkit v6.1.0; this repo is on
  # v7.1.0, so the workflow below now calls the real toolkit/required_builds,
  # toolkit/idiomatic_rust, toolkit/msrv_build, toolkit/test_doc_build, and
  # toolkit/optional_builds jobs directly.
  git-only-build:
    description: >
      Assert the git-only surface (default-features = false) still builds and
      still carries no `rsa`, `lru`, `bsky-sdk` or `gen-linkedin`; also assert
      the `bsky` and `linkedin` features can each be taken independently.

      A feature gate rots silently: a `use sigstore::...` (or `gen_bsky::...`,
      `gen_linkedin::...`) added outside the gate compiles perfectly under
      default features and breaks only for consumers who opted out. Those
      consumers opt out precisely to keep `rsa` (RUSTSEC-2023-0071) and `lru`
      (RUSTSEC-2026-0253, via bsky-sdk -> atrium-api -> atrium-common) — both
      with no fixed version — out of their graph, so the absence of these
      crates is the property asserted here, not merely that the build
      succeeds.

      The check itself lives in scripts/assert-crate-absent.sh (shared with
      `just git-only`) so there's one place, not per-step copies, to keep it
      correct.
    executor:
      name: toolkit/rust_env_rolling
    steps:
      - checkout
      - restore_cache:
          name: Restore dependency cache
          keys:
            - deps-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
            - deps-v1-{{ arch }}-
      - run:
          name: Build without default features
          command: cargo check --no-default-features --package pcu
      - run:
          name: Assert rsa, lru, bsky-sdk and gen-linkedin are absent without their features
          command: |
            set -eo pipefail
            cargo tree --target all --no-default-features --package pcu > /tmp/pcu-tree-ndf.txt
            scripts/assert-crate-absent.sh /tmp/pcu-tree-ndf.txt "--target all --no-default-features" rsa lru bsky-sdk gen-linkedin
      - run:
          name: Build with only the bsky feature (no linkedin)
          command: |
            set -eo pipefail
            cargo check --no-default-features --features bsky --package pcu
            cargo tree --target all --no-default-features --features bsky --package pcu > /tmp/pcu-tree-bsky.txt
            scripts/assert-crate-absent.sh /tmp/pcu-tree-bsky.txt "--target all --no-default-features --features bsky" gen-linkedin
      - run:
          name: Build with only the linkedin feature (no bsky)
          command: |
            set -eo pipefail
            cargo check --no-default-features --features linkedin --package pcu
            cargo tree --target all --no-default-features --features linkedin --package pcu > /tmp/pcu-tree-linkedin.txt
            scripts/assert-crate-absent.sh /tmp/pcu-tree-linkedin.txt "--target all --no-default-features --features linkedin" lru bsky-sdk

  test-setup:
    executor:
      name: toolkit/rust_env_rolling
    parameters:
      pcu_verbosity:
        type: string
        default: "-vv"
        description: "The verbosity of the pcu command"
      pcu_semver:
        type: boolean
        default: false
        description: "Whether or not set the semver version flag"
      pcu_commit_message:
        type: string
        default: "chore: test push"
        description: "The commit message to use for the pcu test push"
    steps:
      - checkout
      - toolkit/gpg_key
      - toolkit/git_config
      - run:
          name: Write compiler version for cache key
          command: rustc --version > rust-toolchain-version.txt
      - restore_cache:
          name: Restore dependency cache
          keys:
            - deps-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
            - deps-v1-{{ arch }}-
      - restore_cache:
          name: Restore build cache (seeded by toolkit/idiomatic_rust)
          keys:
            - build-v1-{{ arch }}-{{ checksum "rust-toolchain-version.txt" }}-{{ checksum "Cargo.lock" }}
            - build-v1-{{ arch }}-
      - run:
          name: Install pcu from project under test
          command: |
            cargo install --force --locked --debug --path ./crates/pcu
      - run:
          name: Copy updated pcu to bin directory
          command: |
            set -exo pipefail

            mkdir -p ~/project/bin
            cp $(which pcu) ~/project/bin/pcu

      - run:
          name: Set test root for bluesky and linkedin testing jobs
          command: |
            echo 'export BSKY_TEST_ROOT="crates/pcu/tests/bsky"' >> bash.env
            echo 'export LINKEDIN_TEST_ROOT="crates/pcu/tests/linkedin"' >> bash.env

      - persist_to_workspace:
          root: .
          paths:
            - bin
            - bash.env

  test-commit:
    executor:
      name: toolkit/rust_env_rolling
    parameters:
      pcu_verbosity:
        type: string
        default: "-vv"
        description: "The verbosity of the pcu command"
      pcu_semver:
        type: boolean
        default: false
        description: "Whether or not set the semver version flag"
      pcu_commit_message:
        type: string
        default: "chore: test push"
        description: "The commit message to use for the pcu test push"
    steps:
      - checkout
      - toolkit/gpg_key
      - toolkit/git_config
      # Start with the test setup workspace
      - attach_workspace:
          at: .
      - run:
          name: Create test file
          command: |
            set -ex
            echo "test" > test.txt
      - run:
          name: Test commit
          command: |
            set -ex

            if [ "<< parameters.pcu_semver >>" == "true"  ] && [ $SEMVER != ""  ]; then
              bin/pcu << parameters.pcu_verbosity >> commit --commit-message "<< parameters.pcu_commit_message >>" --semver $SEMVER
            else
              bin/pcu << parameters.pcu_verbosity >> commit --commit-message "<< parameters.pcu_commit_message >>"
            fi

  test-push:
    executor:
      name: toolkit/rust_env_rolling
    parameters:
      pcu_verbosity:
        type: string
        default: "-vv"
        description: "The verbosity of the pcu command"
      pcu_no_push:
        type: boolean
        default: false
        description: "Whether or not prevent final push of commit"
    steps:
      - checkout
      - toolkit/gpg_key
      - toolkit/git_config
      # Start with the test setup workspace
      - attach_workspace:
          at: .
      - run:
          name: Create test file
          command: |
            set -ex
            echo "test" > test.txt
      - run:
          name: Test push
          command: |
            set -ex
            if [ "<< parameters.pcu_no_push >>" == "true"  ] ; then
              no_push="--no-push"
            else 
              no_push=""
            fi

            bin/pcu << parameters.pcu_verbosity >> push ${no_push}

  test-bsky-directory:
    executor:
      name: toolkit/rust_env_rolling
    parameters:
      pcu_verbosity:
        type: string
        default: "-vv"
        description: "The verbosity of the pcu command"
      pcu_no_push:
        type: boolean
        default: false
        description: "Whether or not prevent final push of commit"
    steps:
      - checkout
      - toolkit/gpg_key
      - toolkit/git_config
      # Start with the test setup workspace
      - attach_workspace:
          at: .

      - run:
          name: Load environment variable
          command: |
            cat bash.env >> $BASH_ENV
      - run:
          name: Use environment variable
          command: echo $BSKY_TEST_ROOT

      - run:
          name: Draft bsky directory
          command: |
            set -ex

            rm -rf $BSKY_TEST_ROOT/bluesky
            mkdir -p $BSKY_TEST_ROOT/bluesky
            ls -la

            bin/pcu << parameters.pcu_verbosity >> bsky draft -d 2025-04-01 -w $BSKY_TEST_ROOT content/blog
            ls -la
            ls -la $BSKY_TEST_ROOT
            ls -la $BSKY_TEST_ROOT/bluesky
            cat $(ls -d $BSKY_TEST_ROOT/bluesky/*)
            ls -la $BSKY_TEST_ROOT/static/s
            cat $(ls -d $BSKY_TEST_ROOT/static/s/*)
            git status

      - run:
          name: Post bsky directory
          command: |
            set -ex

            export TESTING=true
            ls -la $BSKY_TEST_ROOT/bluesky
            bin/pcu << parameters.pcu_verbosity >> bsky post
            ls -la $BSKY_TEST_ROOT/bluesky
            git status

  test-bsky-file:
    executor:
      name: toolkit/rust_env_rolling
    parameters:
      pcu_verbosity:
        type: string
        default: "-vv"
        description: "The verbosity of the pcu command"
      pcu_no_push:
        type: boolean
        default: false
        description: "Whether or not prevent final push of commit"
    steps:
      - checkout
      - toolkit/gpg_key
      - toolkit/git_config
      # Start with the test setup workspace
      - attach_workspace:
          at: .

      - run:
          name: Load environment variable
          command: |
            cat bash.env >> $BASH_ENV
      - run:
          name: Use environment variable
          command: echo $BSKY_TEST_ROOT

      - run:
          name: Test bsky file
          command: |
            set -ex

            rm -rf ${BSKY_TEST_ROOT}/bluesky
            mkdir -p ${BSKY_TEST_ROOT}/bluesky  

            bin/pcu << parameters.pcu_verbosity >> bsky draft -d 2025-04-01 -w ${BSKY_TEST_ROOT} content/blog/bsky-test-blog.md
            ls -la ${BSKY_TEST_ROOT}
            ls -la ${BSKY_TEST_ROOT}/bluesky

      - run:
          name: Display bluesky post contents
          command: |
            set -ex

            ls -la ${BSKY_TEST_ROOT}/bluesky
            cat ${BSKY_TEST_ROOT}/bluesky/$(ls ${BSKY_TEST_ROOT}/bluesky)

      - run:
          name: Display short link contents
          command: |
            set -ex

            ls -la ${BSKY_TEST_ROOT}/static/s
            cat ${BSKY_TEST_ROOT}/static/s/*.html
            cat ${BSKY_TEST_ROOT}/static/s/registry.json

      - run:
          name: Git status after drafting
          command: |
            git status

      - run:
          name: Post bsky file
          command: |
            set -ex

            export TESTING=true
            ls -la ${BSKY_TEST_ROOT}/bluesky
            bin/pcu << parameters.pcu_verbosity >> bsky post
            ls -la ${BSKY_TEST_ROOT}/bluesky
            git status

  test-linkedin-directory:
    executor:
      name: toolkit/rust_env_rolling
    parameters:
      pcu_verbosity:
        type: string
        default: "-vv"
        description: "The verbosity of the pcu command"
    steps:
      - checkout
      - toolkit/gpg_key
      - toolkit/git_config
      - attach_workspace:
          at: .
      - run:
          name: Load environment variables
          command: |
            cat bash.env >> $BASH_ENV
      - run:
          name: Draft linkedin directory
          command: |
            set -ex

            # Reset fixture files to tracked state so idempotency guard doesn't fire
            git checkout -- $LINKEDIN_TEST_ROOT/content/blog/
            rm -rf $LINKEDIN_TEST_ROOT/linkedin
            mkdir -p $LINKEDIN_TEST_ROOT/linkedin

            bin/pcu << parameters.pcu_verbosity >> linkedin draft -d 2025-01-01 -w $LINKEDIN_TEST_ROOT content/blog
            ls -la $LINKEDIN_TEST_ROOT/linkedin
            cat $(ls -d $LINKEDIN_TEST_ROOT/linkedin/*)
            git status

      - run:
          name: Post linkedin directory
          command: |
            set -ex

            export PCU_LINKEDIN_STORE="$LINKEDIN_TEST_ROOT/linkedin"
            export PCU_LINKEDIN_ACCESS_TOKEN="dummy-test-token"
            export PCU_LINKEDIN_AUTHOR_URN="urn:li:organization:123456"
            export TESTING=true

            ls -la $LINKEDIN_TEST_ROOT/linkedin
            bin/pcu << parameters.pcu_verbosity >> linkedin post
            ls -la $LINKEDIN_TEST_ROOT/linkedin
            git status

  test-linkedin-file:
    executor:
      name: toolkit/rust_env_rolling
    parameters:
      pcu_verbosity:
        type: string
        default: "-vv"
        description: "The verbosity of the pcu command"
    steps:
      - checkout
      - toolkit/gpg_key
      - toolkit/git_config
      - attach_workspace:
          at: .
      - run:
          name: Load environment variables
          command: |
            cat bash.env >> $BASH_ENV
      - run:
          name: Draft linkedin file
          command: |
            set -ex

            git checkout -- $LINKEDIN_TEST_ROOT/content/blog/linkedin-test-blog.md
            rm -rf $LINKEDIN_TEST_ROOT/linkedin
            mkdir -p $LINKEDIN_TEST_ROOT/linkedin

            bin/pcu << parameters.pcu_verbosity >> linkedin draft -d 2025-01-01 -w $LINKEDIN_TEST_ROOT content/blog/linkedin-test-blog.md
            ls -la $LINKEDIN_TEST_ROOT/linkedin
            cat $LINKEDIN_TEST_ROOT/linkedin/linkedin-test-blog.linkedin
            git status

      - run:
          name: Post linkedin file
          command: |
            set -ex

            export PCU_LINKEDIN_STORE="$LINKEDIN_TEST_ROOT/linkedin"
            export PCU_LINKEDIN_ACCESS_TOKEN="dummy-test-token"
            export PCU_LINKEDIN_AUTHOR_URN="urn:li:organization:123456"
            export TESTING=true

            ls -la $LINKEDIN_TEST_ROOT/linkedin
            bin/pcu << parameters.pcu_verbosity >> linkedin post
            ls -la $LINKEDIN_TEST_ROOT/linkedin || true
            git status

workflows:
  validation:
    jobs:
      # Signature verification for trusted PRs (with write access for comments)
      - toolkit/verify_commit_signatures:
          name: verify_commit_signatures_trusted
          context: bot-check
          post_comment: true
          update_pcu: false
          filters:
            branches:
              ignore:
                - main
                - /pull\/[0-9]+/
      # Signature verification for forked PRs (read-only, no comments)
      - toolkit/verify_commit_signatures:
          name: verify_commit_signatures_forked
          post_comment: false
          update_pcu: false
          filters:
            branches:
              only: /pull\/[0-9]+/
      # toolkit/required_builds runs `cargo build --all-features` against the
      # full workspace, covering all three crates (gen-bsky, gen-linkedin, pcu)
      # in a single job — no separate per-package matrix jobs needed.
      #
      # No branch filter here (unlike required_builds/msrv_build/test_doc_build/
      # optional_builds below): "security with sonarcloud" runs on main and
      # requires this job for its clippy_report. CircleCI does not run a job
      # whose `requires` dependency was itself filtered out on that branch, so
      # filtering this to ignore: main would silently skip sonarcloud on main
      # entirely — the exact class of bug already fixed once in this repo
      # (see the standing "security must run with sonarcloud on main" rule).
      - toolkit/idiomatic_rust:
          clippy_report: true
      - toolkit/required_builds:
          min_rust_version: << pipeline.parameters.min_rust_version >>
          skip_msrv: true
          requires:
            - toolkit/idiomatic_rust
          filters:
            branches:
              ignore: main
      - toolkit/msrv_build:
          min_rust_version: << pipeline.parameters.min_rust_version >>
          filters:
            branches:
              ignore: main
      - toolkit/test_doc_build:
          filters:
            branches:
              ignore: main
      - toolkit/optional_builds:
          filters:
            branches:
              ignore: main
      - git-only-build:
          filters:
            branches:
              ignore: main
      - toolkit/common_tests:
          min_rust_version: << pipeline.parameters.min_rust_version >>
          test_runner: nextest
          nextest_profile: ci
      - test-setup:
          context:
            - release
            - bot-check
            - pcu-app
          requires:
            - toolkit/idiomatic_rust
          filters:
            branches:
              ignore: main

      - test-commit:
          pcu_verbosity: "-vvvv"
          context:
            - release
            - bot-check
            - pcu-app
          filters:
            branches:
              ignore: main
          requires:
            - test-setup
            - toolkit/common_tests
            - security with sonarcloud
            - toolkit/required_builds
            - git-only-build
            - toolkit/test_doc_build
            - toolkit/idiomatic_rust
      - test-push:
          pcu_verbosity: "-vvvv"
          pcu_no_push: true
          context:
            - release
            - bot-check
            - pcu-app
          filters:
            branches:
              ignore: main
          requires:
            - test-setup
            - toolkit/common_tests
            - security with sonarcloud
            - toolkit/required_builds
            - git-only-build
            - toolkit/test_doc_build
            - toolkit/idiomatic_rust
      - test-bsky-directory:
          pcu_verbosity: "-vvvv"
          pcu_no_push: true
          context:
            - release
            - bot-check
            - pcu-app
            - bluesky
          filters:
            branches:
              ignore: main
          requires:
            - test-setup
            - toolkit/common_tests
            - security with sonarcloud
            - toolkit/required_builds
            - git-only-build
            - toolkit/test_doc_build
            - toolkit/idiomatic_rust
      - test-bsky-file:
          pcu_verbosity: "-vvvv"
          pcu_no_push: true
          context:
            - release
            - bot-check
            - pcu-app
            - bluesky
          filters:
            branches:
              ignore: main
          requires:
            - test-setup
            - toolkit/common_tests
            - security with sonarcloud
            - toolkit/required_builds
            - git-only-build
            - toolkit/test_doc_build
            - toolkit/idiomatic_rust
      - test-linkedin-directory:
          pcu_verbosity: "-vvvv"
          context:
            - release
            - bot-check
            - pcu-app
          filters:
            branches:
              ignore: main
          requires:
            - test-setup
            - toolkit/common_tests
            - security with sonarcloud
            - toolkit/required_builds
            - git-only-build
            - toolkit/test_doc_build
            - toolkit/idiomatic_rust
      - test-linkedin-file:
          pcu_verbosity: "-vvvv"
          context:
            - release
            - bot-check
            - pcu-app
          filters:
            branches:
              ignore: main
          requires:
            - test-setup
            - toolkit/common_tests
            - security with sonarcloud
            - toolkit/required_builds
            - git-only-build
            - toolkit/test_doc_build
            - toolkit/idiomatic_rust

      - toolkit/security:
          name: security audit only
          sonarcloud: false
          filters:
            branches:
              only:
                - /pull\/[0-9]+/
          ignore_advisories: "RUSTSEC-2023-0071 RUSTSEC-2026-0253"
      # toolkit/security defaults no_sonarcloud_on_main: true (skip the
      # sonarcloud/scan step, and the clippy_report import nested inside it,
      # on main) — override it here or main never actually gets scanned
      # despite this job's name and branch filter.
      - toolkit/security:
          name: security with sonarcloud
          context: SonarCloud
          no_sonarcloud_on_main: false
          clippy_report: true
          requires:
            - toolkit/idiomatic_rust
          filters:
            branches:
              ignore:
                - /pull\/[0-9]+/
          ignore_advisories: "RUSTSEC-2023-0071 RUSTSEC-2026-0253"



# Note that all fields that take a lint level have these possible values:
# * deny - An error will be produced and the check will fail
# * warn - A warning will be produced, but the check will not fail
# * allow - No warning or error will be produced, though in some cases a note
# will be

# This section is considered when running `cargo deny check advisories`
# More documentation for the advisories section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
ignore = [
    # rsa 0.9.10: Marvin Attack timing side-channel (CVSS 5.9 medium).
    # No fixed version of rsa is available. Reaches pcu through openidconnect
    # 4.0.1 — which is a DIRECT dependency as well as a transitive one via
    # sigstore 0.14.0 — and only under the `attest` feature, which is on by
    # default for the binary. pcu uses these to SIGN CI attestations; the
    # advisory concerns private-key decryption observable over a network, so
    # a CLI in CI is not exposed. Library consumers that do not attest can take
    # `default-features = false` and drop rsa entirely (see crates/pcu/README.md).
    # Remove wh en openidconnect updates rsa.
    { id = "RUSTSEC-2023-0071", reason = "transitive via sigstore 0.13.0; no fix available upstream" },

    # RUSTSEC-2026-0253: lru 0.16.4 — unsound use-after-free in
    # `LruCache::pop()` (no panic safety). Fix attempted: `cargo update -p lru
    # --dry-run` finds no newer compatible version; the advisory lists no
    # patched release. Path: bsky-sdk 0.1.24 → atrium-api 0.25.8 →
    # atrium-common 0.1.4 → lru 0.16.4 (a non-host/wasm-target dependency —
    # only visible with `cargo tree --target all`). Present only under the
    # `bsky` feature (default-on for the binary). Library consumers that do
    # not use Bluesky posting can take `default-features = false`, or keep
    # `linkedin`/`attest` and just drop `bsky`, to remove lru entirely.
    # Remove when atrium-common updates lru or ships a fix. Tracked:
    # jerus-org/pcu#1037.
    { id = "RUSTSEC-2026-0253", reason = "transitive via sigstore 0.14.0; no fix available upstream" },
]

# This section is considered when running `cargo deny check licenses`
# More documentation for the licenses section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
# [possible values: any SPDX 3.11 short identifier (+ optional exception)].
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "ISC",
    "CDLA-Permissive-2.0",
]
# The confidence threshold for detecting a license from license text.
# The higher the value, the more closely the license text must be to the
# canonical license text of a valid SPDX license file.
# [possible values: any between 0.0 and 1.0].
confidence-threshold = 0.8

# This section is considered when running `cargo deny check bans`.
# More documentation about the 'bans' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "allow"
deny = [
    # Start range due to https://github.com/serde-rs/serde/issues/2538
    # end range due to https://github.com/serde-rs/serde/pull/2590
    { name = "serde_derive", version = ">1.0.171, <1.0.185" },
]

[[licenses.clarify]]
name = "ring"
expression = "LicenseRef-ring"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

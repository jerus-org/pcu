[workspace]
members = ["crates/pcu", "crates/gen-bsky", "crates/gen-linkedin", "crates/pcu-release-assets"]
default-members = ["crates/pcu"]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["jerusdp <jrussell@jerus.ie>"]
rust-version = "1.91"
repository = "https://github.com/jerus-org/pcu"

[workspace.dependencies]
base64 = "0.23.1"
simple-mermaid = "0.2.0"
base62 = "2.2.6"
bsky-sdk = "0.1.24"
cargo_toml = "1.0.1"
chrono = "0.4.45"
clap = "4.6.7"
clap-verbosity-flag = "3.0.4"
color-eyre = "0.6.5"
config = {version = "0.15.26", features = ["toml"], default-features = false}
env_logger = "0.11.11"
gen-bsky = { path = "crates/gen-bsky", version = "0.1.38" }
gen-linkedin = { path = "crates/gen-linkedin", version = "0.1.30" }
# git2 0.21 changed its default features to `[]` (0.20 defaulted to
# ["ssh", "https"]). Without `https`, libgit2 is built with no TLS backend and
# every HTTPS git op fails at runtime ("there is no TLS stream available").
# Enable them explicitly; `ssh` keeps SSH remotes working too.
git2 = { version = "0.21.0", features = ["ssh", "https"] }
git2_credentials = "0.16.0"
gql_client = "1.1.0"
bytes = "1.12.1"
kdeets = "0.1.32"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
keep-a-changelog = "0.1.4"
link-bridge = "0.2.7"
# keep-a-changelog = { git = "https://github.com/jerusdp/keep-a-changelog-rs.git", branch = "feat-add-link" }
# default-features = false + "use_pem" only: pcu's own use of jsonwebtoken is
# limited to `EncodingKey::from_rsa_pem` (PEM/ASN.1 parsing), never signing —
# octocrab does the actual JWT signing internally. Signing needs a crypto
# backend feature ("rust_crypto" or "aws_lc_rs"); "rust_crypto" pulls the
# `rsa` crate (RUSTSEC-2023-0071, no fixed version) unconditionally, which
# broke the CI guard asserting `rsa` is absent without the `attest` feature
# (jerus-org/pcu#1071). octocrab is pinned below to its "jwt-aws-lc-rs"
# feature instead of its default "jwt-rust-crypto" for the same reason.
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["use_pem"] }
log = "0.4.34"
octocrab = { version = "0.54.2", default-features = false, features = [
    "follow-redirect",
    "retry",
    "rustls",
    "timeout",
    "tracing",
    "default-client",
    "rustls-ring",
    "jwt-aws-lc-rs",
] }
owo-colors = "4.4.0"
secrecy = "0.10.3"
pcu-release-assets = { path = "crates/pcu-release-assets", version = "0.1.1" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
sha2 = "0.11.0"
openidconnect = { version = "4.0.1", default-features = false }
sigstore = { version = "0.14.0", default-features = false, features = ["sign", "sigstore-trust-root", "rustls-tls"] }
sigstore_protobuf_specs = "0.5.2"
tokio = { version = "1.53.1", features = ["fs", "macros", "rt-multi-thread", "time"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["std", "env-filter"] }
rstest = "0.27.0"
unicode-segmentation = "1.13.3"
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }
walkdir = "2.5.0"
wiremock = "0.6.5"

[workspace.lints.clippy]
uninlined-format-args = "warn"
